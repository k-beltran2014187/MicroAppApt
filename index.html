<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Enganche · Control de enganche y abonos de tu apartamento</title>
  <meta name="description" content="Lleva el control de tu enganche y de tu crédito del banco: pagos, abonos, parqueos, planos, saldo e intereses. Sube tu cotización en PDF y empieza gratis.">
  <meta property="og:title" content="Mi Enganche · Tu apartamento, siempre bajo control">
  <meta property="og:description" content="Control de pagos de enganche, abonos, parqueos y planos. Sube tu cotización y empieza gratis.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#090b10">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    /* evita el destello: aplica el tema guardado antes de pintar */
    (function () { var t = 'auto'; try { t = localStorage.getItem('enganche.theme') || 'auto'; } catch (e) { }
      if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      var a = 'gold'; try { a = localStorage.getItem('enganche.accent') || 'gold'; } catch (e) { } document.documentElement.dataset.accent = a; })();
  </script>
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
  <div id="app"></div>
  <div id="busy" role="status" aria-live="polite"><div class="bx"><div class="bo"></div><p>Un momento…</p></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=13"></script>
  <script src="calc.js?v=13"></script>
  <script src="quote.js?v=13"></script>

</body>
</html>
